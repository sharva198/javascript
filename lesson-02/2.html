<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 2 Exercises</title>
  </head>
  <body>
    <script>
      // 2a. Soup ($10), 3 burgers ($8 each), 1 ice cream ($5)
      console.log(10 + (3 * 8) + 5); // 39

      // 2b. Same order split among 3 people
      console.log((10 + (3 * 8) + 5) / 3); // 13

      // 2c. 1 toaster ($18.50), 2 shirts ($7.50 each)
      console.log(18.50 + (2 * 7.50)); // 33.5

      // 2d. 10% tax on the order in 2c
      console.log((18.50 + (2 * 7.50)) * 0.1); // 3.35

      // 2e. 20% tax on the order in 2c
      console.log((18.50 + (2 * 7.50)) * 0.2); // 6.7

      // 2f - 2i: Always calculate in cents, then round using Math.round()
      // Toaster $18.99, 1 t-shirt $20.95
      let totalCents = 1899 + 2095;
      console.log(totalCents / 100);

      // 2j. Math.floor practice
      console.log(Math.floor(2.8));

      // 2k. Math.ceil practice
      console.log(Math.ceil(2.2));

      // 2l - 2n: Temperature conversions
      // Celsius to Fahrenheit: (C * 9/5) + 32
      console.log((25 * 9 / 5) + 32); // 25C to F
      // Fahrenheit to Celsius: (F - 32) * 5/9
      console.log((86 - 32) * 5 / 9); // 86F to C
      console.log((-5 * 9 / 5) + 32); // -5C to F
    </script>
  </body>
</html>
