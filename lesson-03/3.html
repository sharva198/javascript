<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 3 Exercises</title>
  </head>
  <body>
    <script>
      // 3a. String of your name
      console.log('My Name');

      // 3b. Concatenate 'My name is: ' and your name
      console.log('My name is: ' + 'My Name');

      // 3c. 'total cost: $' + (5 + 3)
      console.log('Total cost: $' + (5 + 3));

      // 3d. 'Total cost: $' + (599 + 295) / 100
      console.log('Total cost: $' + (599 + 295) / 100);

      // 3e. Template string version of 3d
      console.log(`Total cost: $${(599 + 295) / 100}`);

      // 3f. Alert message from 3e
      alert(`Total cost: $${(599 + 295) / 100}`);

      // 3g. Multi-line string with template string
      console.log(`Items (4): $${(2 * 2095 + 2 * 799) / 100}
Shipping & handling: $${(499 + 499) / 100}`);

      // 3h. Full receipt string
      console.log(`Items (${1 + 1}): $${(2095 + 799) / 100}`);
    </script>
  </body>
</html>
