<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4 Exercises</title>
    <style>
      .yellow-button {
        background-color: yellow;
      }
      .orange-button {
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <!-- 4a. Button with 'Click' -->
    <button>Click</button>

    <!-- 4b. Two buttons with names -->
    <button>Simon</button>
    <button>Chocolate</button>

    <!-- 4c. Paragraph with text -->
    <p>Hello, world!</p>

    <!-- 4d. Paragraph with brief intro -->
    <p>Today I am learning JavaScript basics and HTML structure.</p>

    <!-- 4e - 4g. Styled buttons with onclick logic -->
    <button class="yellow-button" onclick="alert('Added to cart!');">
      Add to cart
    </button>

    <button class="orange-button" onclick="
      console.log('Purchased!');
      alert('Purchased!');
    ">
      Buy now
    </button>

    <script>
      // 4h. Console log welcome
      console.log('Welcome to Lesson 4!');
    </script>
  </body>
</html>
