<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 5 Exercises</title>
  </head>
  <body>
    <script>
      // 5a. Variable 'name'
      const myName = 'Your Name';

      // 5b. Display in console
      console.log(`My name is: ${myName}`);

      // 5c - 5d. Calculate cost in variables
      const coffee = 5;
      const bagel = 3;
      const soup = 9;
      const cost = coffee + (2 * bagel) + soup;
      console.log(`Cost of food: $${cost}`);

      // 5e - 5f. 10% tax calculation
      const tax = cost * 0.1;
      console.log(`Tax (10%): $${tax}`);
      const totalCost = cost + tax;
      console.log(`Total cost: $${totalCost}`);
    </script>
  </body>
</html>
